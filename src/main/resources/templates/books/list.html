<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Книги — ElecLib</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='reading-progress-cards-1')}"/>
</head>
<body class="catalog-page">
<div th:replace="~{fragments/header}"></div>
<main class="main">
    <div th:if="${message}" class="alert success" th:text="${message}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>
    <div th:if="${user != null and continueReading != null}" class="continue-reading">
        <div class="continue-reading-inner">
            <p><strong>Продолжить чтение:</strong>
                <span th:text="${continueReading.title}">Книга</span>
                — стр. <span th:text="${continueReading.lastPage}">1</span>
                из <span th:text="${continueReading.totalPages}">10</span></p>
            <a th:href="@{/books/{id}/read(id=${continueReading.bookId})}" class="btn">Открыть</a>
        </div>
    </div>
    <div class="catalog-toolbar">
    <h1>Книги</h1>
    <div class="search-bar">
        <form th:action="@{/books}" method="get">
            <label for="book-search-q" class="visually-hidden">Поиск по названию или автору</label>
            <input type="text" name="q" id="book-search-q" th:value="${searchQuery}" placeholder="Поиск по названию или автору"/>
            <button type="submit">Искать</button>
        </form>
    </div>
    </div>
    <section th:if="${(searchQuery == null || #strings.isEmpty(searchQuery)) && genreId == null && recommendedBooks != null && !#lists.isEmpty(recommendedBooks)}" class="recommended-section">
        <h2>Рекомендуем</h2>
        <div class="book-grid book-grid-covers">
            <th:block th:each="bookCard : ${recommendedBooks}">
                <div th:replace="~{fragments/book-card :: card(book=${bookCard}, user=${user}, actions='none', shelf=null)}"></div>
            </th:block>
        </div>
    </section>
    <div th:if="${#lists.isEmpty(books)}" class="alert">Книг не найдено.</div>
    <div class="book-grid book-grid-covers" th:if="${!#lists.isEmpty(books)}">
        <th:block th:each="bookCard : ${books}">
            <div th:replace="~{fragments/book-card :: card(book=${bookCard}, user=${user}, actions='none', shelf=null)}"></div>
        </th:block>
    </div>
    <nav class="catalog-pagination" aria-label="Страницы каталога"
         th:if="${currentPage > 0 || hasNextPage}">
        <a class="btn secondary" th:if="${currentPage > 0}"
           th:href="@{/books(page=${currentPage - 1},q=${searchQuery},genreId=${genreId})}">Назад</a>
        <span th:text="|Страница ${currentPage + 1}|">Страница 1</span>
        <a class="btn secondary" th:if="${hasNextPage}"
           th:href="@{/books(page=${currentPage + 1},q=${searchQuery},genreId=${genreId})}">Далее</a>
    </nav>
</main>
<div th:replace="~{fragments/footer}"></div>
</body>
</html>
