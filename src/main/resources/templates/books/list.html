<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Книги — ElecLib</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/header}"></div>
<main class="main">
    <div th:if="${message}" class="alert success" th:text="${message}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>
    <div th:if="${user != null and continueReading != null}" class="continue-reading">
        <div class="continue-reading-inner">
            <p><strong>Продолжить чтение:</strong>
                <span th:text="${continueReading.title}">Книга</span>
                — стр. <span th:text="${continueReading.lastPage}">1</span>
                из <span th:text="${continueReading.totalPages}">10</span></p>
            <a th:href="@{/books/{id}/read(id=${continueReading.bookId})}" class="btn">Открыть</a>
        </div>
    </div>
    <h1>Книги</h1>
    <div class="search-bar">
        <form th:action="@{/books}" method="get">
            <input type="text" name="q" th:value="${searchQuery}" placeholder="Поиск по названию или автору"/>
            <button type="submit">Искать</button>
        </form>
    </div>
    <section th:if="${recommendedBooks != null && !#lists.isEmpty(recommendedBooks)}" class="recommended-section">
        <h2>Рекомендуем</h2>
        <div class="book-grid book-grid-covers">
            <div th:each="b : ${recommendedBooks}"
                 th:replace="~{fragments/book-card :: card(b=${b}, user=${user}, actions='none', shelf=null)}"></div>
        </div>
    </section>
    <div th:if="${#lists.isEmpty(books)}" class="alert">Книг не найдено.</div>
    <div class="book-grid book-grid-covers" th:if="${!#lists.isEmpty(books)}">
        <div th:each="b : ${books}"
             th:replace="~{fragments/book-card :: card(b=${b}, user=${user}, actions='none', shelf=null)}"></div>
    </div>
</main>
<div th:replace="~{fragments/footer}"></div>
</body>
</html>
