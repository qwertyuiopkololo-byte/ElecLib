<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Вход — ElecLib</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<header class="header">
    <a th:href="@{/}" class="logo" href="/">Электронная библиотека</a>
    <nav><a th:href="@{/register}" href="/register">Регистрация</a></nav>
</header>
<main class="main">
    <h1>Вход</h1>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>
    <div th:if="${message}" class="alert success" th:text="${message}"></div>
    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label>Логин</label>
        <input type="text" name="username" required autofocus/>
        <label>Пароль</label>
        <div class="password-wrap">
            <input type="password" name="password" id="login-password" required/>
            <button type="button" class="password-toggle" aria-label="Показать пароль" title="Показать пароль">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
        </div>
        <button type="submit">Войти</button>
    </form>
    <p><a th:href="@{/register}" href="/register" class="btn">Нет аккаунта? Зарегистрироваться</a></p>
</main>
<script>
(function() {
    var btn = document.querySelector('.password-toggle');
    var input = document.getElementById('login-password');
    if (!btn || !input) return;
    var eyeOpen = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    var eyeClosed = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
    btn.addEventListener('click', function() {
        if (input.type === 'password') { input.type = 'text'; btn.innerHTML = eyeClosed; btn.setAttribute('aria-label', 'Скрыть пароль'); btn.title = 'Скрыть пароль'; }
        else { input.type = 'password'; btn.innerHTML = eyeOpen; btn.setAttribute('aria-label', 'Показать пароль'); btn.title = 'Показать пароль'; }
    });
})();
</script>
</body>
</html>
