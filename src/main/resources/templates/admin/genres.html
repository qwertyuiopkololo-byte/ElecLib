<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Жанры — Админ</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/header}"></div>
<main class="main">
    <h1>Жанры</h1>
    <div th:if="${message}" class="alert success" th:text="${message}"></div>
    <p><a th:href="@{/admin}" class="btn secondary">← Назад</a> <a th:href="@{/admin/genres/new}" class="btn">Добавить жанр</a></p>
    <table>
        <thead><tr><th>ID</th><th>Название</th><th>Действия</th></tr></thead>
        <tbody>
            <tr th:each="g : ${genres}">
                <td th:text="${g.genreId}">-</td>
                <td th:text="${g.name}">-</td>
                <td><a th:href="@{/admin/genres/edit/{id}(id=${g.genreId})}">Изменить</a></td>
            </tr>
        </tbody>
    </table>
</main>
<div th:replace="~{fragments/footer}"></div>
</body>
</html>
