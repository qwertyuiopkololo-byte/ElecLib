<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta charset="UTF-8"/>
    <title>Жанр — Админ</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="admin-page">
<div th:replace="~{fragments/header}"></div>
<main class="main">
    <h1 th:text="${genre.genreId != null ? 'Редактировать жанр' : 'Новый жанр'}">Жанр</h1>
    <p><a th:href="@{/admin/genres}" class="btn secondary">← Назад</a></p>
    <form th:action="@{/admin/genres}" th:object="${genre}" method="post">
        <input type="hidden" th:field="*{genreId}"/>
        <label for="name">Название</label>
        <input type="text" th:field="*{name}" id="name" required/>
        <button type="submit">Сохранить</button>
    </form>
</main>
<div th:replace="~{fragments/footer}"></div>
</body>
</html>
