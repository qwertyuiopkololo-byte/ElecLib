<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Избранное — ElecLib</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/header}"></div>
<main class="main">
    <h1>Избранное</h1>
    <div th:if="${#lists.isEmpty(books)}" class="alert">В избранном пока ничего нет.</div>
    <div class="book-grid book-grid-covers" th:if="${!#lists.isEmpty(books)}">
        <div th:each="b : ${books}"
             th:replace="~{fragments/book-card :: card(b=${b}, user=${user}, actions='read-fav', shelf=null)}"></div>
    </div>
    <section th:if="${recommendedBooks != null && !#lists.isEmpty(recommendedBooks)}" class="recommended-section">
        <h2>Рекомендуем</h2>
        <div class="book-grid book-grid-covers">
            <div th:each="b : ${recommendedBooks}"
                 th:replace="~{fragments/book-card :: card(b=${b}, user=${user}, actions='read-fav-add', shelf=null)}"></div>
        </div>
    </section>
</main>
<div th:replace="~{fragments/footer}"></div>
</body>
</html>
