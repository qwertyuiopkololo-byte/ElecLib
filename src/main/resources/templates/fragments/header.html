<header class="header" xmlns:th="http://www.thymeleaf.org">
    <a th:href="@{/books}" class="logo"><span class="logo-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v15M3 4c4-1 6 0 9 2 3-2 5-3 9-2v14c-4-1-6 0-9 2-3-2-5-3-9-2Z"/></svg></span><span>Электронная библиотека</span></a>
    <nav th:if="${user != null}">
        <a th:href="@{/books}">Книги</a>
        <a th:href="@{/my-library}">Моя библиотека</a>
        <a th:href="@{/genres}">Жанры</a>
        <a th:href="@{/reading/stats}">Статистика</a>
        
        <a th:href="@{/profile}" th:text="${user.fullName}">Имя Фамилия</a>
        <th:block th:if="${user != null and user.admin}">
            <a th:href="@{/admin}">Админ</a>
        </th:block>
        <a th:href="@{/profile}" class="header-avatar" aria-label="Мой профиль" title="Мой профиль"><img width="40" height="40" style="width:40px;height:40px;object-fit:cover;border-radius:50%" class="user-avatar" th:src="@{/avatars/{id}(id=${user.userId})}" alt="" onerror="this.hidden=true; this.nextElementSibling.hidden=false"/><span class="user-avatar avatar-fallback" hidden aria-label="Без аватара"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg></span></a>
    </nav>
    <nav th:if="${user == null}">
        <a th:href="@{/login}">Вход</a>
        <a th:href="@{/register}">Регистрация</a>
    </nav>
</header>
