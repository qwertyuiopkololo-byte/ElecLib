<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- actions: none | read-fav | read-fav-add | shelf -->
<div th:fragment="card (book, user, actions, shelf)" class="book-card">
    <a th:href="@{/books/{id}(id=${book.bookId})}" class="book-cover-link" th:aria-label="|Книга: ${book.title}|">
        <img th:if="${book.coverUrl != null && !#strings.isEmpty(book.coverUrl)}"
             class="book-cover-img"
             th:src="${book.coverUrl}"
             th:alt="|Обложка: ${book.title}|"
             width="240" height="360"
             loading="lazy"/>
        <div th:if="${book.coverUrl == null || #strings.isEmpty(book.coverUrl)}"
             class="book-cover-placeholder"
             aria-hidden="true">
            <span class="book-cover-letter"
                  th:text="${book.title != null && !#strings.isEmpty(book.title) ? #strings.substring(book.title, 0, 1) : '?'}">А</span>
        </div>
    </a>
    <div class="book-card-body">
        <h3><a th:href="@{/books/{id}(id=${book.bookId})}" th:text="${book.title}">Title</a></h3>
        <div class="meta">
            <span class="book-author" th:text="${book.authorName}">Author</span><span class="book-genre" th:text="${book.genreName}">Genre</span>
            <span th:if="${book.comic}" class="comic-badge comic-badge-inline">PDF</span>
        </div>
        <div class="rating">
            <th:block th:if="${book.reviewCount > 0}">
                ★ <span th:text="${#numbers.formatDecimal(book.averageRating, 1, 1)}">0</span>
                (<span th:text="${book.reviewCount}">0</span>)
            </th:block>
        </div>
        <p class="desc" th:text="${book.description != null ? #strings.abbreviate(book.description, 100) : ''}">...</p>
        <div class="book-progress-slot">
            <div class="book-reading-progress">
                <div class="book-reading-progress-label">
                    <span th:if="${book.hasProgress}" th:text="|Стр. ${book.lastPosition} из ${book.totalPages}|">Стр. 1 из 10</span>
                    <span th:unless="${book.hasProgress}">Не начато</span>
                    <span th:text="|${book.progressPercent != null ? book.progressPercent : 0}%|">0%</span>
                </div>
                <div class="book-reading-progress-track" role="progressbar" aria-label="Прогресс чтения"
                     th:aria-valuenow="${book.progressPercent != null ? book.progressPercent : 0}" aria-valuemin="0" aria-valuemax="100">
                    <span th:style="|width: ${book.progressPercent != null ? book.progressPercent : 0}%|"></span>
                </div>
            </div>
        </div>
        <p th:if="${book.subscriptionRequired && user != null}"><small>Нужна подписка</small></p>
        <div th:if="${actions == 'read-fav'}" class="card-actions">
            <a th:href="@{/books/{id}/read(id=${book.bookId})}" class="btn" th:if="${!book.subscriptionRequired}">Читать</a>
            <form th:action="@{/books/{id}/favorite(id=${book.bookId})}" method="post" class="inline-form">
                <input type="hidden" name="add" value="0"/>
                <input type="hidden" name="returnTo" value="favorites"/>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn secondary">Удалить</button>
            </form>
        </div>
        <div th:if="${actions == 'read-fav-add'}" class="card-actions">
            <a th:href="@{/books/{id}/read(id=${book.bookId})}" class="btn" th:if="${!book.subscriptionRequired}">Читать</a>
            <form th:action="@{/books/{id}/favorite(id=${book.bookId})}" method="post" class="inline-form">
                <input type="hidden" name="add" value="1"/>
                <input type="hidden" name="returnTo" value="favorites"/>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn secondary">В избранное</button>
            </form>
        </div>
        <div th:if="${actions == 'comic'}" class="card-actions">
            <a th:href="@{/books/{id}/read(id=${book.bookId})}" class="btn"
               th:if="${!book.subscriptionRequired && book.comicReady}">Читать</a>
            <span th:if="${book.subscriptionRequired}" class="btn secondary btn-muted">Нужна подписка</span>
            <span th:if="${!book.subscriptionRequired && !book.comicReady}" class="btn secondary btn-disabled">PDF не загружен</span>
            <form th:action="@{/books/{id}/favorite(id=${book.bookId})}" method="post" class="inline-form"
                  th:if="${!book.inFavorites}">
                <input type="hidden" name="add" value="1"/>
                <input type="hidden" name="returnTo" value="comics"/>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn secondary">В избранное</button>
            </form>
            <form th:action="@{/books/{id}/favorite(id=${book.bookId})}" method="post" class="inline-form"
                  th:if="${book.inFavorites}">
                <input type="hidden" name="add" value="0"/>
                <input type="hidden" name="returnTo" value="comics"/>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn secondary">Из избранного</button>
            </form>
        </div>
        <div th:if="${actions == 'shelf' && shelf != null}" class="card-actions">
            <a th:href="@{/books/{id}/read(id=${book.bookId})}" class="btn" th:if="${!book.subscriptionRequired}">Читать</a>
            <form th:action="@{/shelves/{sid}/books/{bid}/remove(sid=${shelf.shelfId},bid=${book.bookId})}" method="post" class="inline-form">
                <input type="hidden" name="from" value="shelf"/>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn secondary small">Убрать с полки</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
