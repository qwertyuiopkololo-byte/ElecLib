<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- actions: none | read-fav | read-fav-add | shelf -->
<div th:fragment="card (book, user, actions, shelf)" class="book-card">
    <a th:href="@{/books/{id}(id=${book.bookId})}" class="book-cover-link" th:aria-label="|Книга: ${book.title}|">
        <img th:if="${book.coverUrl != null && !#strings.isEmpty(book.coverUrl)}"
             class="book-cover-img"
             th:src="${book.coverUrl}"
             th:alt="|Обложка: ${book.title}|"
             loading="lazy"/>
        <div th:if="${book.coverUrl == null || #strings.isEmpty(book.coverUrl)}"
             class="book-cover-placeholder"
             aria-hidden="true">
            <span class="book-cover-letter"
                  th:text="${book.title != null && !#strings.isEmpty(book.title) ? #strings.substring(book.title, 0, 1) : '?'}">А</span>
        </div>
    </a>
    <div class="book-card-body">
        <h3><a th:href="@{/books/{id}(id=${book.bookId})}" th:text="${book.title}">Title</a></h3>
        <div class="meta">
            <span th:text="${book.authorName}">Author</span> · <span th:text="${book.genreName}">Genre</span>
        </div>
        <div class="rating" th:if="${book.reviewCount > 0}">
            ★ <span th:text="${#numbers.formatDecimal(book.averageRating, 1, 1)}">0</span>
            (<span th:text="${book.reviewCount}">0</span>)
        </div>
        <p class="desc" th:if="${book.description}" th:text="${#strings.abbreviate(book.description, 100)}">...</p>
        <p th:if="${book.subscriptionRequired && user != null}"><small>Нужна подписка</small></p>
        <div th:if="${actions == 'read-fav'}" class="card-actions">
            <a th:href="@{/books/{id}/read(id=${book.bookId})}" class="btn" th:if="${!book.subscriptionRequired}">Читать</a>
            <form th:action="@{/books/{id}/favorite(id=${book.bookId})}" method="post" style="display:inline;">
                <input type="hidden" name="add" value="0"/>
                <input type="hidden" name="returnTo" value="favorites"/>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn secondary">Удалить</button>
            </form>
        </div>
        <div th:if="${actions == 'read-fav-add'}" class="card-actions">
            <a th:href="@{/books/{id}/read(id=${book.bookId})}" class="btn" th:if="${!book.subscriptionRequired}">Читать</a>
            <form th:action="@{/books/{id}/favorite(id=${book.bookId})}" method="post" style="display:inline;">
                <input type="hidden" name="add" value="1"/>
                <input type="hidden" name="returnTo" value="favorites"/>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn secondary">В избранное</button>
            </form>
        </div>
        <div th:if="${actions == 'shelf' && shelf != null}" class="card-actions">
            <a th:href="@{/books/{id}/read(id=${book.bookId})}" class="btn" th:if="${!book.subscriptionRequired}">Читать</a>
            <form th:action="@{/shelves/{sid}/books/{bid}/remove(sid=${shelf.shelfId},bid=${book.bookId})}" method="post" style="display:inline;">
                <input type="hidden" name="from" value="shelf"/>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn secondary small">Убрать с полки</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
