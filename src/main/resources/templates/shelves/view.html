<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${shelf.name} + ' — ElecLib'">Полка</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/header}"></div>
<main class="main">
    <p><a th:href="@{/shelves}" class="btn secondary">← Все полки</a></p>
    <h1 th:text="${shelf.name}">Полка</h1>
    <div th:if="${message}" class="alert success" th:text="${message}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>

    <div th:if="${#lists.isEmpty(books)}" class="alert">На этой полке пока нет книг.</div>
    <div class="book-grid book-grid-covers" th:if="${!#lists.isEmpty(books)}">
        <div th:each="b : ${books}"
             th:replace="~{fragments/book-card :: card(b=${b}, user=${user}, actions='shelf', shelf=${shelf})}"></div>
    </div>
</main>
<div th:replace="~{fragments/footer}"></div>
</body>
</html>
