<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${shelf.name} + ' — ElecLib'">Полка</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/header}"></div>
<main class="main">
    <p><a th:href="@{/shelves}" class="btn secondary">← Все полки</a></p>
    <h1 th:text="${shelf.name}">Полка</h1>
    <div th:if="${message}" class="alert success" th:text="${message}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>

    <div th:if="${#lists.isEmpty(books)}" class="alert">На этой полке пока нет книг.</div>
    <div class="book-grid" th:if="${!#lists.isEmpty(books)}">
        <div class="book-card" th:each="b : ${books}">
            <h3><a th:href="@{/books/{id}(id=${b.bookId})}" th:text="${b.title}">Title</a></h3>
            <div class="meta"><span th:text="${b.authorName}">Author</span> · <span th:text="${b.genreName}">Genre</span></div>
            <div class="rating" th:if="${b.reviewCount > 0}">
                ★ <span th:text="${#numbers.formatDecimal(b.averageRating, 1, 1)}">0</span>
            </div>
            <p class="desc" th:if="${b.description}" th:text="${#strings.abbreviate(b.description, 100)}">...</p>
            <div class="card-actions">
                <a th:href="@{/books/{id}/read(id=${b.bookId})}" class="btn" th:if="${!b.subscriptionRequired}">Читать</a>
                <form th:action="@{/shelves/{sid}/books/{bid}/remove(sid=${shelf.shelfId},bid=${b.bookId})}" method="post" style="display:inline;">
                    <input type="hidden" name="from" value="shelf"/>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn secondary small">Убрать с полки</button>
                </form>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer}"></div>
</body>
</html>
