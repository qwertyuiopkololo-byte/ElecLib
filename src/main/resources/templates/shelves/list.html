<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Мои полки — ElecLib</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/header}"></div>
<main class="main">
    <h1>Мои полки</h1>
    <div th:if="${message}" class="alert success" th:text="${message}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>

    <section class="shelf-new">
        <h2>Новая полка</h2>
        <form th:action="@{/shelves/create}" method="post" class="shelf-new-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="text" name="name" maxlength="120" placeholder="Название" required/>
            <button type="submit">Создать</button>
        </form>
    </section>

    <ul class="shelf-list" th:if="${!#lists.isEmpty(summaries)}">
        <li th:each="sum : ${summaries}" class="shelf-list-item">
            <a th:href="@{/shelves/{id}(id=${sum.shelf.shelfId})}" th:text="${sum.shelf.name}">Полка</a>
            <span class="shelf-count" th:text="'(' + ${sum.bookCount} + ')'">(0)</span>
        </li>
    </ul>
    <p th:if="${#lists.isEmpty(summaries)}" class="alert">Полок пока нет.</p>
</main>
<div th:replace="~{fragments/footer}"></div>
</body>
</html>
