<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${pageTitle != null ? pageTitle : 'Электронная библиотека'}">Электронная библиотека</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<header class="header">
    <a th:href="@{/books}" class="logo"><span class="logo-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v15M3 4c4-1 6 0 9 2 3-2 5-3 9-2v14c-4-1-6 0-9 2-3-2-5-3-9-2Z"/></svg></span><span>Электронная библиотека</span></a>
    <nav th:if="${user != null}">
        <a th:href="@{/books}">Книги</a>
        <a th:href="@{/genres}">Жанры</a>
        <a th:href="@{/favorites}">Избранное</a>
        <a th:href="@{/comics}">Комиксы</a>
        <a th:href="@{/shelves}">Полки</a>
        <a th:href="@{/reading/stats}">Статистика</a>
        <a th:href="@{/subscription}">Подписка</a>
        <th:block th:if="${user != null and user.admin}">
            <a th:href="@{/admin}">Админ</a>
        </th:block>
        <form th:action="@{/logout}" method="post" class="inline">
            <button type="submit">Выйти</button>
        </form>
    </nav>
    <nav th:if="${user == null}">
        <a th:href="@{/login}">Вход</a>
        <a th:href="@{/register}">Регистрация</a>
    </nav>
</header>
<main class="main">
    <div th:if="${message}" class="alert success" th:text="${message}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>
    <div th:replace="~{::content}">Content</div>
</main>
<footer class="footer">
    <p>Электронная библиотека</p>
</footer>
</body>
</html>
