# Подхват локальных секретов (файл в .gitignore), см. application.properties.example
spring.config.import=optional:classpath:application-local.properties

# Supabase: переменные SUPABASE_URL / SUPABASE_KEY или application-local.properties
supabase.url=${SUPABASE_URL:}
supabase.key=${SUPABASE_KEY:}

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

server.address=0.0.0.0
server.port=8080
server.servlet.session.timeout=30m

# Комиксы: PDF на диске (папка не в git)
eleclib.comics.dir=data/comics
# Демо-комикс «Приключение в ElecLib» при первом запуске (нужен Supabase)
eleclib.sample-comic.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
