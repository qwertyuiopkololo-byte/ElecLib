# Supabase: либо переменные окружения SUPABASE_URL и SUPABASE_KEY,
# либо профиль local + файл application-local.properties (не коммитится), см. application.properties.example.
supabase.url=${SUPABASE_URL:}
supabase.key=${SUPABASE_KEY:}

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Server — слушать на всех интерфейсах, чтобы заходить с других устройств в сети
server.address=0.0.0.0
server.port=8080
server.servlet.session.timeout=30m
